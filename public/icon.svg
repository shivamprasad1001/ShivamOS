<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" shape-rendering="crispEdges">
  <!-- Retro Cream Paper Backdrop -->
  <rect width="32" height="32" fill="#E8E0C8" />
  <!-- Outer Hard Border -->
  <rect x="2" y="2" width="28" height="28" fill="#1A1A1A" />
  <rect x="4" y="4" width="24" height="24" fill="#F4EFE0" />
  <!-- Monitor Bezel Shadow -->
  <rect x="8" y="8" width="18" height="14" fill="#1A1A1A" />
  <!-- Monitor Casing -->
  <rect x="6" y="6" width="18" height="14" fill="#1A1A1A" />
  <rect x="8" y="8" width="14" height="10" fill="#0B130B" />
  <!-- CRT Terminal Prompt ">_" in Phosphor Green -->
  <rect x="10" y="10" width="2" height="1" fill="#33FF66" />
  <rect x="12" y="11" width="2" height="1" fill="#33FF66" />
  <rect x="10" y="12" width="2" height="1" fill="#33FF66" />
  <rect x="15" y="13" width="4" height="2" fill="#33FF66" />
  <!-- Tomato & Teal Accent LEDs -->
  <rect x="8" y="19" width="3" height="1" fill="#E4572E" />
  <rect x="12" y="19" width="3" height="1" fill="#2A9D8F" />
  <!-- Monitor Stand & Base -->
  <rect x="12" y="20" width="6" height="3" fill="#1A1A1A" />
  <rect x="9" y="23" width="12" height="3" fill="#1A1A1A" />
  <rect x="10" y="24" width="10" height="1" fill="#E4572E" />
</svg>
